<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Contato | Contatos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            --brand-warning: #F59E0B;
            --bg-global: #F9FAFB;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --input-bg: #F1F5F9;
            --input-border-focus: #F59E0B;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        body {
            background-color: var(--bg-global);
            background-image: 
                radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(217, 119, 6, 0.04) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 460px;
            perspective: 1000px;
        }
        .card {
            background: var(--card-bg);
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.06), 
                        0 0 0 1px rgba(15, 23, 42, 0.04);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-badge {
            width: 48px;
            height: 48px;
            background: var(--brand-gradient);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 16px rgba(217, 119, 6, 0.2);
        }
        .logo-badge svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: white;
        }
        h1 {
            color: var(--text-main);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .header p {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin: 24px 0 12px 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E2E8F0;
        }
        .form-group {
            margin-bottom: 16px;
            position: relative;
        }
        .form-group label {
            display: block;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper svg {
            position: absolute;
            left: 16px;
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            transition: color 0.2s;
            pointer-events: none;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 48px;
            background-color: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        .input-wrapper input::placeholder {
            color: #94A3B8;
        }
        .input-wrapper input:focus {
            background-color: #FFFFFF;
            border-color: var(--input-border-focus);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
            outline: none;
        }
        .input-wrapper input:focus ~ svg {
            color: var(--brand-warning);
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--brand-gradient);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px -6px rgba(217, 119, 6, 0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 20px;
        }
        .btn-submit:hover {
            box-shadow: 0 12px 24px -4px rgba(217, 119, 6, 0.4);
            transform: translateY(-1px);
            filter: brightness(1.05);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <div class="logo-badge">
                <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                </svg>
            </div>
            <h1>Atualizar Registro</h1>
            <p>Modifique os dados de um contato existente</p>
        </div>
        
        <form method="post" action="AtualizaServlet">
            
            <div class="section-title">Quem deseja alterar?</div>
            
            <div class="form-group">
                <label for="nomeAntigo">Nome Atual do Contato</label>
                <div class="input-wrapper">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" id="nomeAntigo" name="txNomeAntigo" placeholder="Nome salvo no banco" required autocomplete="off">
                </div>
            </div>

            <div class="section-title">Novos Dados</div>

            <div class="form-group">
                <label for="nomeNovo">Novo Nome Completo</label>
                <div class="input-wrapper">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <input type="text" id="nomeNovo" name="txNomeNovo" placeholder="Ex: Novo Nome Silva" required autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label for="telefoneNovo">Novo Telefone</label>
                <div class="input-wrapper">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                    <input type="tel" id="telefoneNovo" name="txTelNovo" placeholder="(00) 99999-9999" required autocomplete="off">
                </div>
            </div>

            <button type="submit" class="btn-submit">Salvar Alterações</button>
        </form>
    </div>
</div>
</body>
</html>
