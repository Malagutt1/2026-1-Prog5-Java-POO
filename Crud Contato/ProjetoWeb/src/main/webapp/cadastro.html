<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Contato | Contatos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #FFB800 0%, #FF5C00 100%);
            --brand-orange: #FF5C00;
            --brand-yellow: #FFB800;
            --bg-global: #F9FAFB;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --input-bg: #F1F5F9;
            --input-border-focus: #FF9E00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-global);
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 184, 0, 0.07) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 92, 0, 0.05) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            perspective: 1000px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.06), 
                        0 0 0 1px rgba(15, 23, 42, 0.04);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-badge {
            width: 48px;
            height: 48px;
            background: var(--brand-gradient);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 16px rgba(255, 92, 0, 0.2);
        }

        .logo-badge svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        h1 {
            color: var(--text-main);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg {
            position: absolute;
            left: 16px;
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            transition: color 0.2s;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background-color: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .input-wrapper input::placeholder {
            color: #94A3B8;
        }

        /* Micro-interações de Focus */
        .input-wrapper input:focus {
            background-color: #FFFFFF;
            border-color: var(--input-border-focus);
            box-shadow: 0 0 0 4px rgba(255, 158, 0, 0.15);
            outline: none;
        }

        .input-wrapper input:focus ~ svg {
            color: var(--brand-orange);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--brand-gradient);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px -6px rgba(255, 92, 0, 0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 12px;
        }

        .btn-submit:hover {
            box-shadow: 0 12px 24px -4px rgba(255, 92, 0, 0.4);
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .btn-submit:active {
            transform: translateY(1px);
            box-shadow: 0 6px 12px -4px rgba(255, 92, 0, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <div class="logo-badge">
                <!-- Ícone de adicionar usuário minimalista -->
                <svg viewBox="0 0 24 24">
                    <path d="M19 13h-2v2h-2v-2h-2v-2h2V9h2v2h2v2zm-7-1c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <h1>Novo Cadastro</h1>
            <p>Insira as informações essenciais do contato</p>
        </div>

        <form method="post" action="CadastraServlet">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <div class="input-wrapper">
                    <!-- Ícone de Usuário -->
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <input type="text" id="nome" name="txNome" placeholder="Ex: Kauã" required autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone Comercial</label>
                <div class="input-wrapper">
                    <!-- Ícone de Telefone -->
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                    <input type="tel" id="telefone" name="txTel" placeholder="(00) 90000-0000" required autocomplete="off">
                </div>
            </div>

            <button type="submit" class="btn-submit">Criar Novo Registro</button>
        </form>
    </div>
</div>

</body>
</html>
