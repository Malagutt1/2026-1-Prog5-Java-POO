<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora | JavaServlets</title>
    <style>
        /* Reset básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1), 0 1px 3px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }
        .container:hover {
            transform: translateY(-5px); 
        }
        h1 {
            text-align: center;
            color: #1a365d;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }
        /* Estilo do Visor da Calculadora (Recuperado) */
        .visor {
            background-color: #1a202c; 
            color: #63b3ed; 
            font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 35px; /* Reduzi um pouco para caber toda a conta */
            font-weight: bold;
            text-align: right; 
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.6);
            border: 2px solid #cbd5e0;
            overflow: hidden;
            white-space: nowrap;
            letter-spacing: 2px;
            height: 75px; /* Altura fixa para não encolher quando vazio */
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 14px;
        }
        input[type="number"], 
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 16px;
            background-color: #f8fafc;
            color: #2d3748;
            transition: all 0.3s ease; 
        }
        input[type="number"]:focus, 
        input[type="text"]:focus {
            border-color: #3182ce;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2); 
        }
        input[type="text"]#op {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 2px;
        }
        input[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        input[type="submit"]:hover {
            background: linear-gradient(135deg, #2b6cb0 0%, #2c5282 100%);
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
            transform: translateY(-2px); 
        }
        input[type="submit"]:active {
            transform: translateY(0);
            box-shadow: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Calculadora Web</h1>
    
    <div id="visor" class="visor">0</div>

    <form action="Calculadora" method="post">
        
        <div class="form-group">
            <label for="v1">Valor 1:</label>
            <input type="number" id="v1" name="txtValor1" step="any" placeholder="Ex: 15.5" required>
        </div>
        
        <div class="form-group">
            <label for="op">Operação: (+ - * /)</label>
            <input type="text" id="op" name="txtOp" maxlength="1" placeholder="+" required>
        </div>
        
        <div class="form-group">
            <label for="v2">Valor 2:</label>
            <input type="number" id="v2" name="txtValor2" step="any" placeholder="Ex: 2" required>
        </div>
        
        <input type="submit" value="Calcular Resultado">
    </form>
</div>

<script>
function atualizarVisor() {
    let v1 = document.getElementById("v1").value;
    let op = document.getElementById("op").value;
    let v2 = document.getElementById("v2").value;
    let textoVisor = (v1 + " " + op + " " + v2).trim();
    
    if (textoVisor === "") {
        textoVisor = "0";
    }
    document.getElementById("visor").innerText = textoVisor;
}

document.getElementById("v1").addEventListener("input", atualizarVisor);
document.getElementById("v2").addEventListener("input", atualizarVisor);
document.getElementById("op").addEventListener("input", atualizarVisor);
</script>
</body>
</html>
